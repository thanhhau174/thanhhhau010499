<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trắc Nghiệm Từ Vựng Tiếng Anh - Google Sheets</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    
    .container { width: 100%; max-width: 600px; background: var(--card-bg); padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: var(--primary); margin-bottom: 20px; font-size: 1.5rem; }

    /* Configuration Panel */
    .config-panel { background: #f8fafc; padding: 16px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
    .config-panel label { font-size: 0.85rem; font-weight: 600; color: #64748b; display: block; margin-bottom: 6px; }
    .input-group { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; outline: none; }
    input[type="text"]:focus { border-color: var(--primary); }

    .btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn-audio { background: #10b981; border: none; color: white; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; margin-top: 8px; }

    /* Question Card */
    .card { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 20px; }
    .english-word { font-size: 2rem; font-weight: bold; color: var(--primary); }
    .phonetic { color: #64748b; font-size: 1rem; margin-top: 4px; }

    /* Multiple Choice Options */
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 20px; }
    .option-btn { background: #ffffff; border: 2px solid #e2e8f0; padding: 14px 18px; border-radius: 10px; text-align: left; font-size: 1rem; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; }
    .option-btn:hover:not([disabled]) { border-color: var(--primary); background: #f0f5ff; }
    .option-prefix { font-weight: bold; color: var(--primary); margin-right: 12px; min-width: 24px; }
    
    /* Nhãn Từ Loại hiển thị trong từng đáp án */
    .option-pos { background: #e0e7ff; color: #4338ca; font-size: 0.8rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-right: 10px; text-transform: lowercase; }

    /* Option States */
    .option-btn.correct { background-color: #d1fae5 !important; border-color: var(--success) !important; color: #065f46; }
    .option-btn.wrong { background-color: #fee2e2 !important; border-color: var(--danger) !important; color: #991b1b; }

    /* Controls & Progress */
    .controls { display: flex; justify-content: space-between; align-items: center; }
    .score { font-weight: 600; color: #059669; }
    .hidden { display: none; }
    .loading { text-align: center; color: #64748b; margin: 10px 0; }
  </style>
</head>
<body>

<div class="container">
  <h1>Trắc Nghiệm Từ Vựng</h1>

  <!-- Configuration Panel -->
  <div class="config-panel">
    <label for="sheet-url">Dán link Google Sheets (.csv) đã xuất bản:</label>
    <div class="input-group">
      <input type="text" id="sheet-url" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv">
      <button class="btn" onclick="saveAndLoadSheet()">Nạp dữ liệu</button>
    </div>
  </div>

  <div id="loading" class="loading hidden">Đang tải từ vựng từ Google Sheets...</div>

  <!-- Quiz Area -->
  <div id="quiz-area" class="hidden">
    <div class="card">
      <div class="english-word" id="word-text">Word</div>
      <div class="phonetic" id="phonetic-text">/phonetic/</div>
      <button class="btn-audio" onclick="speakCurrentWord()">🔊 Phát âm</button>
    </div>

    <!-- 4 Đáp án A B C D đi kèm Từ loại -->
    <div class="options-grid" id="options-container"></div>

    <div class="controls">
      <div class="score">Tiến độ: <span id="score-val">0</span>/<span id="total-val">0</span></div>
      <button class="btn" id="next-btn" style="visibility: hidden;" onclick="nextQuestion()">Câu tiếp theo ➔</button>
    </div>
  </div>
</div>

<script>
  let words = [];
  let currentIndex = 0;
  let score = 0;
  let isAnswered = false;

  window.onload = function() {
    const savedUrl = localStorage.getItem("gg_sheet_csv_url");
    if (savedUrl) {
      document.getElementById("sheet-url").value = savedUrl;
      fetchGoogleSheetData(savedUrl);
    }
  };

  function saveAndLoadSheet() {
    const url = document.getElementById("sheet-url").value.trim();
    if (!url) return alert("Vui lòng nhập link CSV Google Sheets!");
    localStorage.setItem("gg_sheet_csv_url", url);
    fetchGoogleSheetData(url);
  }

  function getFieldValue(item, keys) {
    if (!item) return "";
    for (let key of keys) {
      if (item[key] !== undefined && item[key] !== "") return item[key];
    }
    return "";
  }

  function fetchGoogleSheetData(url) {
    document.getElementById("loading").classList.remove("hidden");
    document.getElementById("quiz-area").classList.add("hidden");

    Papa.parse(url, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        document.getElementById("loading").classList.add("hidden");
        
        words = results.data.map(row => {
          let cleanRow = {};
          for (let key in row) cleanRow[key.trim().toLowerCase()] = row[key].trim();
          return cleanRow;
        }).filter(item => getFieldValue(item, ["word", "tu_vung", "tuvung"]) && getFieldValue(item, ["meaning", "nghia"]));

        if (words.length >= 4) {
          startQuiz();
        } else {
          alert("Danh sách cần ít nhất 4 từ vựng để tạo bài trắc nghiệm ABCD!");
        }
      },
      error: function() {
        document.getElementById("loading").classList.add("hidden");
        alert("Lỗi tải Google Sheets! Đảm bảo bạn đã xuất bản dạng CSV.");
      }
    });
  }

  function startQuiz() {
    document.getElementById("quiz-area").classList.remove("hidden");
    words.sort(() => Math.random() - 0.5);
    currentIndex = 0;
    score = 0;
    document.getElementById("total-val").innerText = words.length;
    showQuestion();
  }

  function showQuestion() {
    if (currentIndex >= words.length) {
      alert(`Chúc mừng! Bạn đã hoàn thành bài luyện tập.\nKết quả: ${score}/${words.length} câu đúng.`);
      return;
    }

    isAnswered = false;
    document.getElementById("next-btn").style.visibility = "hidden";
    const current = words[currentIndex];

    // Hiển thị từ Tiếng Anh & Phiên âm ở thẻ câu hỏi
    document.getElementById("word-text").innerText = getFieldValue(current, ["word", "tu_vung", "tuvung", "từ vựng"]);
    document.getElementById("phonetic-text").innerText = getFieldValue(current, ["phonetic", "phien_am", "phienam", "phiên âm"]);

    speakCurrentWord();

    // Tạo đối tượng đáp án đúng chứa cả nghĩa lẫn từ loại
    const correctObj = {
      meaning: getFieldValue(current, ["meaning", "nghia", "nghĩa"]),
      type: getFieldValue(current, ["type", "tu_loai", "tuloai", "từ loại", "pos"])
    };

    let options = [correctObj];
    let usedMeanings = [correctObj.meaning];

    // Lấy ngẫu nhiên 3 đáp án sai kèm theo từ loại của chính từ đó
    while (options.length < 4 && options.length < words.length) {
      const randomWord = words[Math.floor(Math.random() * words.length)];
      const randomMeaning = getFieldValue(randomWord, ["meaning", "nghia", "nghĩa"]);
      const randomType = getFieldValue(randomWord, ["type", "tu_loai", "tuloai", "từ loại", "pos"]);

      if (!usedMeanings.includes(randomMeaning) && randomMeaning) {
        usedMeanings.push(randomMeaning);
        options.push({
          meaning: randomMeaning,
          type: randomType
        });
      }
    }

    // Xáo trộn vị trí A B C D
    options.sort(() => Math.random() - 0.5);

    // Render 4 nút đáp án A, B, C, D kèm Từ loại
    const container = document.getElementById("options-container");
    container.innerHTML = "";
    const prefixes = ["A", "B", "C", "D"];

    options.forEach((opt, index) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      
      const typeHtml = opt.type ? `<span class="option-pos">${opt.type}</span>` : '';
      btn.innerHTML = `<span class="option-prefix">${prefixes[index]}.</span> ${typeHtml} <span>${opt.meaning}</span>`;
      
      btn.onclick = () => selectOption(btn, opt.meaning, correctObj.meaning);
      container.appendChild(btn);
    });

    document.getElementById("score-val").innerText = score;
  }

  function selectOption(selectedBtn, selectedMeaning, correctMeaning) {
    if (isAnswered) return;
    isAnswered = true;

    const allButtons = document.querySelectorAll(".option-btn");
    
    if (selectedMeaning === correctMeaning) {
      score++;
      selectedBtn.classList.add("correct");
    } else {
      selectedBtn.classList.add("wrong");
      // Đánh dấu xanh đáp án đúng
      allButtons.forEach(btn => {
        if (btn.innerText.includes(correctMeaning)) {
          btn.classList.add("correct");
        }
      });
    }

    allButtons.forEach(btn => btn.setAttribute("disabled", "true"));
    document.getElementById("score-val").innerText = score;
    document.getElementById("next-btn").style.visibility = "visible";
  }

  function nextQuestion() {
    currentIndex++;
    showQuestion();
  }

  function speakCurrentWord() {
    const targetWord = getFieldValue(words[currentIndex], ["word", "tu_vung", "tuvung", "từ vựng"]);
    if ('speechSynthesis' in window && targetWord) {
      const utterance = new SpeechSynthesisUtterance(targetWord);
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    }
  }
</script>

</body>
</html>
